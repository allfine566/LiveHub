name: Check YouTube Live Streams

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install yt-dlp and jq
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq

      - name: Check for live streams
        run: |
          INPUT="LiveStreams.json"
          OUTPUT="live.json"
          TEMP="/tmp/live_results.json"
          
          echo "[]" > "$TEMP"
          COUNT=$(jq '.channels | length' "$INPUT")
          echo "Checking $COUNT channels from $INPUT..."
          
          for i in $(seq 0 $((COUNT - 1))); do
            ID=$(jq -r ".channels[$i].id" "$INPUT")
            NAME=$(jq -r ".channels[$i].name" "$INPUT")
            URL=$(jq -r ".channels[$i].url" "$INPUT")
            
            echo "→ $NAME ($URL)"
            
            # Lê as primeiras 5 lives da aba /streams e filtra apenas as que estão "is_live"
            INFO=$(yt-dlp --playlist-items 1-5 --match-filter "is_live" --dump-single-json --skip-download "$URL" 2>/tmp/yt_err.log) || INFO=""
            
            if [ -n "$INFO" ] && [ "$INFO" != "{}" ]; then
              VIDEO_ID=$(echo "$INFO" | jq -r '.entries[0].id // empty')
              TITLE=$(echo "$INFO" | jq -r '.entries[0].title // empty')
              
              if [ -n "$VIDEO_ID" ]; then
                echo "   ✓ LIVE (video: $VIDEO_ID)"
                jq --arg id "$ID" --arg name "$NAME" --arg vid "$VIDEO_ID" --arg title "$TITLE" \
                   '. + [{id: $id, name: $name, video_id: $vid, title: $title}]' "$TEMP" > "${TEMP}.new" && mv "${TEMP}.new" "$TEMP"
              else
                echo "   ✗ not live (filter matched but no ID found)."
              fi
            else
              # Se falhar, imprime o erro exato do YouTube no log!
              ERR=$(tail -n 1 /tmp/yt_err.log)
              if [ -z "$ERR" ]; then ERR="Nenhuma live encontrada nas primeiras 5 transmissões."; fi
              echo "   ✗ failed ou not live. Motivo: $ERR"
            fi
            
            sleep 3
          done
          
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq -n --arg ts "$TIMESTAMP" --slurpfile live "$TEMP" '{updated_at: $ts, live: $live[0]}' > "$OUTPUT"
          echo "──────────────────────────────────────────"
          echo "Wrote $OUTPUT with $(jq '.live | length' "$OUTPUT") live stream(s)."

      - name: Commit and push live.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update live streams [skip ci]"
            git push
          fi
