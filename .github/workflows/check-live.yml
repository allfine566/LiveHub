name: Check YouTube Live Streams

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-live-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yt-dlp and jq
        run: |
          sudo curl -fL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq
          yt-dlp --version
          jq --version

      - name: Check YouTube channels
        shell: bash
        run: |
          set -u
          INPUT="LiveStreams.json"
          OUTPUT="live.json"
          ERROR_FILE="/tmp/yt_errors.log"
          
          LIVE_JSON="[]"
          STATUS_JSON="[]"

          if [ ! -f "$INPUT" ]; then
            echo "ERROR: $INPUT not found."
            exit 1
          fi

          COUNT=$(jq '.channels | length' "$INPUT")
          echo "Checking $COUNT YouTube channels..."
          echo "------------------------------------------"

          for i in $(seq 0 $((COUNT - 1))); do
            ID=$(jq -r ".channels[$i].id" "$INPUT")
            NAME=$(jq -r ".channels[$i].name" "$INPUT")
            URL=$(jq -r ".channels[$i].url" "$INPUT")

            echo ""
            echo "Checking: $NAME ($URL)"
            
            FOUND=0
            CHECK_ERROR=0

            # 1. Obter a lista rápida dos últimos 5 vídeos da aba /streams
            PLAYLIST_JSON=$(yt-dlp --flat-playlist --dump-single-json --playlist-end 5 --no-warnings --no-progress "$URL" 2>"$ERROR_FILE") || PLAYLIST_JSON=""

            if [ -z "$PLAYLIST_JSON" ]; then
              echo "   ✗ ERROR: Não foi possível ler a lista do canal."
              CHECK_ERROR=1
            else
              mapfile -t VIDEO_IDS < <(echo "$PLAYLIST_JSON" | jq -r '.entries[]? | select(.id != null) | .id')

              if [ "${#VIDEO_IDS[@]}" -eq 0 ]; then
                echo "   ✗ WARNING: Nenhum item recente encontrado."
                CHECK_ERROR=1
              fi

              # 2. Verificar individualmente os vídeos encontrados até achar um "LIVE"
              for VIDEO_ID in "${VIDEO_IDS[@]}"; do
                VIDEO_URL="https://www.youtube.com/watch?v=$VIDEO_ID"
                VIDEO_JSON=$(yt-dlp --dump-single-json --skip-download --no-warnings --no-progress "$VIDEO_URL" 2>>"$ERROR_FILE") || VIDEO_JSON=""

                if [ -z "$VIDEO_JSON" ]; then
                  continue
                fi

                IS_LIVE=$(echo "$VIDEO_JSON" | jq -r 'if .is_live == true or .live_status == "is_live" then "true" else "false" end')

                if [ "$IS_LIVE" = "true" ]; then
                  VIDEO_TITLE=$(echo "$VIDEO_JSON" | jq -r '.title // "Untitled"')
                  THUMBNAIL=$(echo "$VIDEO_JSON" | jq -r '.thumbnail // ""')
                  VIDEO_ID_FOUND=$(echo "$VIDEO_JSON" | jq -r '.id // empty')

                  echo "   ✓ LIVE DETECTADA: $VIDEO_TITLE (ID: $VIDEO_ID_FOUND)"

                  LIVE_JSON=$(echo "$LIVE_JSON" | jq \
                    --arg id "$ID" \
                    --arg name "$NAME" \
                    --arg video_id "$VIDEO_ID_FOUND" \
                    --arg title "$VIDEO_TITLE" \
                    --arg thumbnail "$THUMBNAIL" \
                    '. + [{id: $id, name: $name, video_id: $video_id, title: $title, thumbnail: $thumbnail}]')

                  FOUND=1
                  break
                fi
              done
            fi

            if [ "$FOUND" -eq 0 ]; then
              echo "   ✗ Sem transmissões ao vivo no momento."
            fi

            # Grava no relatório individual de status
            STATUS_JSON=$(echo "$STATUS_JSON" | jq \
              --arg id "$ID" \
              --arg name "$NAME" \
              --argjson is_live $([ "$FOUND" -eq 1 ] && echo "true" || echo "false") \
              --argjson has_error $([ "$CHECK_ERROR" -eq 1 ] && echo "true" || echo "false") \
              '. + [{id: $id, name: $name, is_live: $is_live, error: $has_error}]')

            sleep 2
          done

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          jq -n \
            --arg ts "$TIMESTAMP" \
            --argjson live "$LIVE_JSON" \
            --argjson status "$STATUS_JSON" \
            '{updated_at: $ts, live_count: ($live | length), live: $live, channels_status: $status}' > "$OUTPUT"

          echo "------------------------------------------"
          echo "Wrote $OUTPUT successfully!"
          echo "Live streams count: $(jq '.live | length' "$OUTPUT")"

      - name: Commit and push live.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.json
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update live streams status [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
