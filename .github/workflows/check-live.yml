name: Check YouTube Live Streams (Low-Quota API)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-live-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check YouTube Live via Batch API
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        shell: bash
        run: |
          set -u
          INPUT="LiveStreams.json"
          OUTPUT="live.json"

          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "ERROR: YOUTUBE_API_KEY secret is missing!"
            exit 1
          fi

          if [ ! -f "$INPUT" ]; then
            echo "ERROR: $INPUT file not found!"
            exit 1
          fi

          LIVE_JSON="[]"
          STATUS_JSON="[]"

          COUNT=$(jq '.channels | length' "$INPUT")
          echo "Checking $COUNT channels (Optimized Low-Quota Mode)..."
          echo "--------------------------------------------------------"

          for i in $(seq 0 $((COUNT - 1))); do
            ID=$(jq -r ".channels[$i].id" "$INPUT")
            NAME=$(jq -r ".channels[$i].name" "$INPUT")
            PLAYLIST_ID=$(jq -r ".channels[$i].uploads_playlist_id // empty" "$INPUT")

            echo ""
            echo "Checking: $NAME"

            FOUND=0
            HAS_ERROR=0
            VIDEO_ID=""
            TITLE=""
            THUMBNAIL=""

            if [ -z "$PLAYLIST_ID" ]; then
              echo "   ✗ Erro: uploads_playlist_id não configurado no JSON."
              HAS_ERROR=1
            else
              # 1. Pega os 3 vídeos mais recentes da playlist do canal (Custo: 1 Ponto)
              PL_URL="https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&playlistId=${PLAYLIST_ID}&maxResults=3&key=${YOUTUBE_API_KEY}"
              PL_RESP=$(curl -s "$PL_URL")

              ERR_CHECK=$(echo "$PL_RESP" | jq -r '.error.message // empty')
              if [ -n "$ERR_CHECK" ]; then
                echo "   ✗ API Error: $ERR_CHECK"
                HAS_ERROR=1
              else
                # Extrai os IDs dos 3 vídeos mais recentes
                VIDEO_IDS=$(echo "$PL_RESP" | jq -r '.items[]?.snippet.resourceId.videoId' | tr '\n' ',' | sed 's/,$//')

                if [ -n "$VIDEO_IDS" ]; then
                  # 2. Verifica em lote se algum desses vídeos é uma LIVE ativa (Custo: 1 Ponto)
                  VID_URL="https://www.googleapis.com/youtube/v3/videos?part=snippet,liveStreamingDetails&id=${VIDEO_IDS}&key=${YOUTUBE_API_KEY}"
                  VID_RESP=$(curl -s "$VID_URL")

                  # Filtra o item que possui a tag de live ativa
                  LIVE_ITEM=$(echo "$VID_RESP" | jq '.items[] | select(.snippet.liveBroadcastContent == "live")' | head -n 1)

                  if [ -n "$LIVE_ITEM" ] && [ "$LIVE_ITEM" != "null" ]; then
                    VIDEO_ID=$(echo "$LIVE_ITEM" | jq -r '.id')
                    TITLE=$(echo "$LIVE_ITEM" | jq -r '.snippet.title')
                    THUMBNAIL=$(echo "$LIVE_ITEM" | jq -r '.snippet.thumbnails.high.url // .snippet.thumbnails.default.url')

                    echo "   ✓ LIVE ATIVA DETECTADA: $TITLE (ID: $VIDEO_ID)"
                    FOUND=1

                    LIVE_JSON=$(echo "$LIVE_JSON" | jq \
                      --arg id "$ID" \
                      --arg name "$NAME" \
                      --arg video_id "$VIDEO_ID" \
                      --arg title "$TITLE" \
                      --arg thumbnail "$THUMBNAIL" \
                      '. + [{id: $id, name: $name, video_id: $video_id, title: $title, thumbnail: $thumbnail}]')
                  else
                    echo "   ✗ Sem transmissões ao vivo no momento."
                  fi
                else
                  echo "   ✗ Nenhum vídeo recente encontrado na playlist."
                fi
              fi
            fi

            STATUS_JSON=$(echo "$STATUS_JSON" | jq \
              --arg id "$ID" \
              --arg name "$NAME" \
              --argjson is_live $([ "$FOUND" -eq 1 ] && echo "true" || echo "false") \
              --argjson has_error $([ "$HAS_ERROR" -eq 1 ] && echo "true" || echo "false") \
              '. + [{id: $id, name: $name, is_live: $is_live, error: $has_error}]')
          done

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          jq -n \
            --arg ts "$TIMESTAMP" \
            --argjson live "$LIVE_JSON" \
            --argjson status "$STATUS_JSON" \
            '{updated_at: $ts, live_count: ($live | length), live: $live, channels_status: $status}' > "$OUTPUT"

          echo "--------------------------------------------------------"
          echo "Wrote $OUTPUT successfully!"
          echo "Live count: $(jq '.live | length' "$OUTPUT")"

      - name: Commit e Push do live.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.json
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update live streams status via Batch API [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
