name: Check YouTube Live Streams (Official API Direct Search)

on:
  schedule:
    # Executa a cada 15 minutos para manter folga na cota diária (14 canais x 100 cotas x 96 vezes = 13.440 -> a cada 15 min usa 1.400 por rodada)
    # Recomendado: a cada 20 ou 30 minutos (ex: '*/30 * * * *') para zero risco de estouro de cota
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-live-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check YouTube Live via Direct Search API
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        shell: bash
        run: |
          set -u
          INPUT="LiveStreams.json"
          OUTPUT="live.json"

          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "ERROR: YOUTUBE_API_KEY secret is empty or missing in GitHub Secrets!"
            exit 1
          fi

          if [ ! -f "$INPUT" ]; then
            echo "ERROR: $INPUT file not found!"
            exit 1
          fi

          LIVE_JSON="[]"
          STATUS_JSON="[]"

          COUNT=$(jq '.channels | length' "$INPUT")
          echo "Checking $COUNT channels via YouTube Data API v3..."
          echo "--------------------------------------------------------"

          for i in $(seq 0 $((COUNT - 1))); do
            ID=$(jq -r ".channels[$i].id" "$INPUT")
            NAME=$(jq -r ".channels[$i].name" "$INPUT")
            CHANNEL_ID=$(jq -r ".channels[$i].channel_id // empty" "$INPUT")

            echo ""
            echo "Checking: $NAME ($CHANNEL_ID)"

            FOUND=0
            HAS_ERROR=0
            VIDEO_ID=""
            TITLE=""
            THUMBNAIL=""

            if [ -z "$CHANNEL_ID" ]; then
              echo "   ✗ Erro: channel_id não configurado no JSON."
              HAS_ERROR=1
            else
              # Chamada direta para buscar live ativa (eventType=live)
              API_URL="https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${CHANNEL_ID}&type=video&eventType=live&key=${YOUTUBE_API_KEY}"
              RESPONSE=$(curl -s "$API_URL")

              # Exibe erro caso a chave de API falhe
              ERROR_MSG=$(echo "$RESPONSE" | jq -r '.error.message // empty')

              if [ -n "$ERROR_MSG" ]; then
                echo "   ✗ API ERROR: $ERROR_MSG"
                HAS_ERROR=1
              else
                VIDEO_ID=$(echo "$RESPONSE" | jq -r '.items[0].id.videoId // empty')
                
                if [ -n "$VIDEO_ID" ]; then
                  TITLE=$(echo "$RESPONSE" | jq -r '.items[0].snippet.title // "Ao Vivo"')
                  THUMBNAIL=$(echo "$RESPONSE" | jq -r '.items[0].snippet.thumbnails.high.url // .items[0].snippet.thumbnails.default.url // ""')

                  echo "   ✓ LIVE DETECTADA: $TITLE (ID: $VIDEO_ID)"
                  FOUND=1

                  LIVE_JSON=$(echo "$LIVE_JSON" | jq \
                    --arg id "$ID" \
                    --arg name "$NAME" \
                    --arg video_id "$VIDEO_ID" \
                    --arg title "$TITLE" \
                    --arg thumbnail "$THUMBNAIL" \
                    '. + [{id: $id, name: $name, video_id: $video_id, title: $title, thumbnail: $thumbnail}]')
                else
                  echo "   ✗ Canal offline / Sem live ativa no momento."
                fi
              fi
            fi

            STATUS_JSON=$(echo "$STATUS_JSON" | jq \
              --arg id "$ID" \
              --arg name "$NAME" \
              --argjson is_live $([ "$FOUND" -eq 1 ] && echo "true" || echo "false") \
              --argjson has_error $([ "$HAS_ERROR" -eq 1 ] && echo "true" || echo "false") \
              '. + [{id: $id, name: $name, is_live: $is_live, error: $has_error}]')
          done

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          jq -n \
            --arg ts "$TIMESTAMP" \
            --argjson live "$LIVE_JSON" \
            --argjson status "$STATUS_JSON" \
            '{updated_at: $ts, live_count: ($live | length), live: $live, channels_status: $status}' > "$OUTPUT"

          echo "--------------------------------------------------------"
          echo "Wrote $OUTPUT successfully!"
          echo "Total de lives encontradas: $(jq '.live | length' "$OUTPUT")"

      - name: Commit e Push do live.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.json
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update live streams status via YouTube API [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
