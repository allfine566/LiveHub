name: Check YouTube Live Streams

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-live-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yt-dlp and jq
        run: |
          sudo curl -fL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq
          yt-dlp --version
          jq --version

      - name: Check YouTube channels
        shell: bash
        run: |
          set -u
          INPUT="LiveStreams.json"
          OUTPUT="live.json"
          ERROR_FILE="/tmp/yt_errors.log"
          
          LIVE_JSON="[]"
          STATUS_JSON="[]"

          if [ ! -f "$INPUT" ]; then
            echo "ERROR: $INPUT not found."
            exit 1
          fi

          COUNT=$(jq '.channels | length' "$INPUT")
          echo "Checking $COUNT YouTube channels..."
          echo "------------------------------------------"

          for i in $(seq 0 $((COUNT - 1))); do
            ID=$(jq -r ".channels[$i].id" "$INPUT")
            NAME=$(jq -r ".channels[$i].name" "$INPUT")
            URL=$(jq -r ".channels[$i].url" "$INPUT")

            # Garante que o URL aponta para a aba de transmissões
            STREAMS_URL=$(echo "$URL" | sed 's/\/*$/\/streams/')

            echo ""
            echo "Checking: $NAME ($STREAMS_URL)"
            
            FOUND=0
            CHECK_ERROR=0
            VIDEO_ID_FOUND=""
            VIDEO_TITLE=""
            THUMBNAIL=""

            # Método 1: Busca direta por live ativa na aba /streams usando match-filter no yt-dlp
            LIVE_DATA=$(yt-dlp \
              --playlist-end 5 \
              --match-filter "is_live" \
              --dump-single-json \
              --skip-download \
              --no-warnings \
              --no-progress \
              "$STREAMS_URL" 2>"$ERROR_FILE") || LIVE_DATA=""

            if [ -n "$LIVE_DATA" ]; then
              # Se encontrou no nível superior do JSON (vídeo único)
              VIDEO_ID_FOUND=$(echo "$LIVE_DATA" | jq -r '.id // empty')
              
              # Se for uma playlist tratada com entradas
              if [ -z "$VIDEO_ID_FOUND" ]; then
                VIDEO_ID_FOUND=$(echo "$LIVE_DATA" | jq -r '.entries[]? | select(.is_live == true or .live_status == "is_live") | .id' | head -n 1)
              fi

              if [ -n "$VIDEO_ID_FOUND" ]; then
                VIDEO_TITLE=$(echo "$LIVE_DATA" | jq -r '.title // .entries[0].title // "Ao Vivo"')
                THUMBNAIL=$(echo "$LIVE_DATA" | jq -r '.thumbnail // .entries[0].thumbnail // ""')
                FOUND=1
              fi
            fi

            # Método 2 (Fallback): Testar rota direta /live caso o Método 1 não encontre
            if [ "$FOUND" -eq 0 ]; then
              BASE_URL=$(echo "$URL" | sed 's/\/streams//g' | sed 's/\/$//g')
              DIRECT_URL="${BASE_URL}/live"
              
              DIRECT_DATA=$(yt-dlp \
                --dump-single-json \
                --skip-download \
                --no-warnings \
                --no-progress \
                "$DIRECT_URL" 2>>"$ERROR_FILE") || DIRECT_DATA=""

              if [ -n "$DIRECT_DATA" ]; then
                IS_LIVE=$(echo "$DIRECT_DATA" | jq -r 'if .is_live == true or .live_status == "is_live" then "true" else "false" end')
                if [ "$IS_LIVE" = "true" ]; then
                  VIDEO_ID_FOUND=$(echo "$DIRECT_DATA" | jq -r '.id // empty')
                  VIDEO_TITLE=$(echo "$DIRECT_DATA" | jq -r '.title // "Ao Vivo"')
                  THUMBNAIL=$(echo "$DIRECT_DATA" | jq -r '.thumbnail // ""')
                  FOUND=1
                fi
              fi
            fi

            if [ "$FOUND" -eq 1 ]; then
              echo "   ✓ LIVE DETECTADA: $VIDEO_TITLE (ID: $VIDEO_ID_FOUND)"

              LIVE_JSON=$(echo "$LIVE_JSON" | jq \
                --arg id "$ID" \
                --arg name "$NAME" \
                --arg video_id "$VIDEO_ID_FOUND" \
                --arg title "$VIDEO_TITLE" \
                --arg thumbnail "$THUMBNAIL" \
                '. + [{id: $id, name: $name, video_id: $video_id, title: $title, thumbnail: $thumbnail}]')
            else
              echo "   ✗ Canal offline / Sem live ativa no momento."
            fi

            # Grava no relatório de status individual
            STATUS_JSON=$(echo "$STATUS_JSON" | jq \
              --arg id "$ID" \
              --arg name "$NAME" \
              --argjson is_live $([ "$FOUND" -eq 1 ] && echo "true" || echo "false") \
              --argjson has_error $([ "$CHECK_ERROR" -eq 1 ] && echo "true" || echo "false") \
              '. + [{id: $id, name: $name, is_live: $is_live, error: $has_error}]')

            sleep 2
          done

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          jq -n \
            --arg ts "$TIMESTAMP" \
            --argjson live "$LIVE_JSON" \
            --argjson status "$STATUS_JSON" \
            '{updated_at: $ts, live_count: ($live | length), live: $live, channels_status: $status}' > "$OUTPUT"

          echo "------------------------------------------"
          echo "Wrote $OUTPUT com sucesso!"
          echo "Lives ativas detectadas: $(jq '.live | length' "$OUTPUT")"

      - name: Commit e Push do live.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.json
          
          if git diff --cached --quiet; then
            echo "Sem alterações para registrar."
          else
            git commit -m "Atualiza status das transmissões ao vivo [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
